        goldPerTurn:
          type: number
          description: Base gold income per turn
        goldSpendPerTurn:
          type: number
          description: Base gold spend per turn
        incomeVariance:
          type: number
          description: Variance factor for income (0-1)
        spendVariance:
          type: number
          description: Variance factor for spending (0-1)
        startingGold:
          type: number
        label:
          type: ["string", "null"]
      required:
