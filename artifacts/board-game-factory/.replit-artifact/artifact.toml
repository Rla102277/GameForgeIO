kind = "web"
previewPath = "/"
title = "AI Board Game Factory"
version = "1.0.0"
id = "artifacts/board-game-factory"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23155

[services.development]
run = "pnpm --filter @workspace/board-game-factory run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/board-game-factory", "run", "build" ]
publicDir = "artifacts/board-game-factory/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23155"
BASE_PATH = "/"
